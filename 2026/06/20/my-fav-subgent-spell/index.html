        <figure class="highlight text"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">Take these N feature requests and implement them in parallel using independent subagents, one per feature branch. For each: (1) write a short spec, (2) write failing tests first, (3) implement until all tests pass without modifying unrelated files, (4) run a self-review that flags any change not directly tied to the stated goal and reverts scope creep, (5) commit only the intended files and open a PR. Keep the full existing test suite green for every branch. Summarize each PR and any tradeoffs at the end.</span><br></pre></td></tr></table></figure>
